<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 630" font-family="system-ui, -apple-system, Segoe UI, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9399b2"/></marker></defs>
  <rect width="560" height="630" rx="14" fill="#1e1e2e"/>
  <text x="280" y="36" text-anchor="middle" fill="#cdd6f4" font-size="18" font-weight="600">What happens when you hit Enter on sudo</text>
  <g font-size="17">
    <rect x="30" y="60" width="500" height="68" rx="10" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
    <circle cx="66" cy="94" r="15" fill="#89b4fa"/><text x="66" y="100" text-anchor="middle" fill="#1e1e2e" font-weight="700">1</text>
    <text x="96" y="90" fill="#cdd6f4" font-weight="600">You run sudo</text><text x="96" y="112" fill="#a6adc8" font-size="14">a normal user, uid 1000</text>

    <rect x="30" y="152" width="500" height="68" rx="10" fill="#313244" stroke="#f38ba8" stroke-width="2"/>
    <circle cx="66" cy="186" r="15" fill="#f38ba8"/><text x="66" y="192" text-anchor="middle" fill="#1e1e2e" font-weight="700">2</text>
    <text x="96" y="182" fill="#cdd6f4" font-weight="600">sudo starts as root</text><text x="96" y="204" fill="#a6adc8" font-size="14">the setuid bit gives it euid 0</text>

    <rect x="30" y="244" width="500" height="68" rx="10" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
    <circle cx="66" cy="278" r="15" fill="#89b4fa"/><text x="66" y="284" text-anchor="middle" fill="#1e1e2e" font-weight="700">3</text>
    <text x="96" y="274" fill="#cdd6f4" font-weight="600">It asks for your password</text><text x="96" y="296" fill="#a6adc8" font-size="14">yours, not root's</text>

    <rect x="30" y="336" width="500" height="68" rx="10" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
    <circle cx="66" cy="370" r="15" fill="#89b4fa"/><text x="66" y="376" text-anchor="middle" fill="#1e1e2e" font-weight="700">4</text>
    <text x="96" y="366" fill="#cdd6f4" font-weight="600">It checks /etc/sudoers</text><text x="96" y="388" fill="#a6adc8" font-size="14">may you run this command, as that user?</text>

    <rect x="30" y="428" width="500" height="68" rx="10" fill="#313244" stroke="#f9e2af" stroke-width="2"/>
    <circle cx="66" cy="462" r="15" fill="#f9e2af"/><text x="66" y="468" text-anchor="middle" fill="#1e1e2e" font-weight="700">5</text>
    <text x="96" y="458" fill="#cdd6f4" font-weight="600">It calls seteuid</text><text x="96" y="480" fill="#a6adc8" font-size="14">switches to the target user (usually root)</text>

    <rect x="30" y="520" width="500" height="68" rx="10" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
    <circle cx="66" cy="554" r="15" fill="#a6e3a1"/><text x="66" y="560" text-anchor="middle" fill="#1e1e2e" font-weight="700">6</text>
    <text x="96" y="550" fill="#cdd6f4" font-weight="600">Your command runs</text><text x="96" y="572" fill="#a6adc8" font-size="14">with the target user's privileges</text>
  </g>
  <g stroke="#9399b2" stroke-width="2" marker-end="url(#a)">
    <line x1="280" y1="128" x2="280" y2="149"/><line x1="280" y1="220" x2="280" y2="241"/><line x1="280" y1="312" x2="280" y2="333"/>
    <line x1="280" y1="404" x2="280" y2="425"/><line x1="280" y1="496" x2="280" y2="517"/>
  </g>
</svg>
