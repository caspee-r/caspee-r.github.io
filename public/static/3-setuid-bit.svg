<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" font-family="system-ui, -apple-system, Segoe UI, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9399b2"/></marker></defs>
  <rect width="760" height="370" rx="14" fill="#1e1e2e"/>
  <rect x="20" y="20" width="720" height="130" rx="10" fill="#11111b"/>
  <circle cx="42" cy="38" r="5" fill="#f38ba8"/><circle cx="60" cy="38" r="5" fill="#f9e2af"/><circle cx="78" cy="38" r="5" fill="#a6e3a1"/>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18">
    <text x="40" y="82" fill="#a6e3a1">$</text><text x="62" y="82" fill="#cdd6f4">ls -l /usr/bin/sudo</text>
    <text x="40" y="122" fill="#cdd6f4" textLength="108" lengthAdjust="spacing">-rwsr-xr-x</text>
    <text x="162" y="122" fill="#cdd6f4">1 root root 232416 Sep 12 /usr/bin/sudo</text>
  </g>
  <rect x="70" y="102" width="15" height="28" rx="3" fill="none" stroke="#f9e2af" stroke-width="2"/>
  <line x1="78" y1="130" x2="78" y2="176" stroke="#f9e2af" stroke-width="2"/>
  <text x="78" y="196" fill="#f9e2af" font-size="15">the setuid bit: an "s" where the owner's "x" would be</text>
  <g text-anchor="middle" font-size="15">
    <rect x="20" y="236" width="200" height="72" rx="10" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
    <text x="120" y="266" fill="#cdd6f4" font-weight="600">You run it</text><text x="120" y="288" fill="#a6e3a1">uid 1000</text>
    <rect x="280" y="236" width="200" height="72" rx="10" fill="#313244" stroke="#f9e2af" stroke-width="2"/>
    <text x="380" y="266" fill="#cdd6f4" font-weight="600">Root-owned file</text><text x="380" y="288" fill="#f9e2af">setuid bit set</text>
    <rect x="540" y="236" width="200" height="72" rx="10" fill="#313244" stroke="#f38ba8" stroke-width="2"/>
    <text x="640" y="266" fill="#cdd6f4" font-weight="600">Process runs with</text><text x="640" y="288" fill="#f38ba8">euid 0 (root)</text>
  </g>
  <g stroke="#9399b2" stroke-width="2" marker-end="url(#a)"><line x1="220" y1="272" x2="277" y2="272"/><line x1="480" y1="272" x2="537" y2="272"/></g>
  <text x="380" y="346" text-anchor="middle" fill="#6c7086" font-size="12">Example output; size and date will differ on your system.</text>
</svg>
