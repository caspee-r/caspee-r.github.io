<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 210" font-family="system-ui, -apple-system, Segoe UI, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="560" height="210" rx="14" fill="#1e1e2e"/>
  <text x="280" y="34" text-anchor="middle" fill="#cdd6f4" font-size="18" font-weight="600">Anatomy of a sudoers rule</text>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="32">
    <text x="60" y="88" fill="#89b4fa" textLength="96" lengthAdjust="spacing">alice</text>
    <text x="175.2" y="88" fill="#a6e3a1" textLength="57.6" lengthAdjust="spacing">ALL</text>
    <text x="232.8" y="88" fill="#6c7086" textLength="19.2" lengthAdjust="spacing">=</text>
    <text x="252" y="88" fill="#f9e2af" textLength="172.8" lengthAdjust="spacing">(ALL:ALL)</text>
    <text x="444" y="88" fill="#f38ba8" textLength="57.6" lengthAdjust="spacing">ALL</text>
  </g>
  <g stroke-width="2">
    <line x1="108" y1="100" x2="108" y2="130" stroke="#89b4fa"/><line x1="204" y1="100" x2="204" y2="130" stroke="#a6e3a1"/>
    <line x1="338" y1="100" x2="338" y2="130" stroke="#f9e2af"/><line x1="473" y1="100" x2="473" y2="130" stroke="#f38ba8"/>
  </g>
  <g text-anchor="middle">
    <text x="108" y="152" fill="#89b4fa" font-size="17" font-weight="700">who</text><text x="108" y="173" fill="#a6adc8" font-size="13">the user</text>
    <text x="204" y="152" fill="#a6e3a1" font-size="17" font-weight="700">where</text><text x="204" y="173" fill="#a6adc8" font-size="13">the machine</text>
    <text x="338" y="152" fill="#f9e2af" font-size="17" font-weight="700">as whom</text><text x="338" y="173" fill="#a6adc8" font-size="13">user:group to run as</text>
    <text x="473" y="152" fill="#f38ba8" font-size="17" font-weight="700">what</text><text x="473" y="173" fill="#a6adc8" font-size="13">which commands</text>
  </g>
</svg>
